[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mitre-coverage-kit"
version = "0.1.0"
description = "Measure SIEM detection coverage against MITRE ATT&CK and ATLAS, export a Navigator layer and render a heat map."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Leandro F. Juárez" }]
keywords = ["mitre", "attack", "atlas", "siem", "detection-engineering", "navigator"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Information Technology",
  "Topic :: Security",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.urls]
Author = "https://www.linkedin.com/in/leandrofjuarez"

[project.scripts]
coveragekit = "coveragekit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/coveragekit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
